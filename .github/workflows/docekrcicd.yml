name: Backend Docker Build and Push

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'  # Only trigger when backend files change
      - '.github/workflows/backend-docker.yml'

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Debug - List backend files
      run: |
        echo "=== Backend Directory Contents ==="
        ls -la backend/
        echo ""
        echo "=== Check Dockerfile ==="
        if [ -f "backend/Dockerfile" ]; then
          echo "✓ Dockerfile found!"
          head -5 backend/Dockerfile
        else
          echo "✗ Dockerfile NOT found!"
        fi
    
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and Push Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/legalmate-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/legalmate-backend:${{ github.sha }}